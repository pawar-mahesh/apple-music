         starts: the first tap on a song otherwise also paid for its server's
         DNS, TCP and TLS (120–190 ms measured before any audio arrived). Both
         modes for the song hosts: the <audio> element fetches without CORS,
         the memory copies of the next songs (fetch) with it, and browsers keep
         the two in separate connection pools. -->

    <!-- Root paths ("/icon-706c8c9f.svg"), and Vite puts the `base` in front of them.
         These files live in public/, and Vite's documented way to link one is
         its path from the root: in dev AND at build time it rewrites the href
         to `${base}icon-706c8c9f.svg`, so it resolves to the same file from any route
         depth and follows `base` wherever the app is deployed.

         Written any other way they break somewhere:
           - hardcoded /apple-music/ breaks anywhere else;
           - RELATIVE breaks on every nested route: on
               /apple-music/playlist/work-out-with-bollywood/pl.f47c…
             the browser asked for …/work-out-with-bollywood/icon-706c8c9f.svg, got a
             404 and drew no icon, and the manifest failed the same way, so a
             deep link was not installable;
           - /apple-music/ is right at build time, but Vite 8's dev server adds
             the base AGAIN to a public-file href, so dev asked for
             /apple-music/apple-music/manifest.webmanifest, got the HTML
             fallback, and the console reported the manifest as a syntax error
             at line 1, column 1. -->
    <!-- Four icon declarations, all drawn from Apple's own 1024px music-icon
         artwork, and each one is the ONLY thing some platform will read:
           .ico       Windows, and anything that probes /favicon-2b6befc5.ico without
                      looking at this document at all. Multi-resolution
                      (16/32/48) so no client has to resample.
           SVG        every modern browser: one vector scaled to whatever the
                      tab, bookmark bar or task switcher asks for, at any
                      display density, instead of resampling a raster.
           PNG 96     the fallback for browsers with no SVG icon support, at a
                      size the 16-32 CSS px a tab draws is a downscale of even
                      on a 2x display.
           180 PNG    iOS and iPadOS home screens, which ignore the manifest
                      entirely and read only this tag. 180x180 is what the
                      current devices ask for; `sizes` is spelled out so the OS
                      does not have to fetch it to find out.
         Android and the desktop install dialogs take theirs from the manifest.
         Every icon is drawn from the one geometry in icon-706c8c9f.svg, fitted to the
         Music app icon macOS 26 renders at 1024px: the note at the app's
         size and position, and the .ico, SVG, PNG 96 and the manifest's "any"
         icons cut to its continuous-corner squircle (SwiftUI's .continuous
         rounded rect at 26.05% of the side) with transparent corners, since
         browsers and Windows draw them exactly as shipped. The touch icon and
         the maskable icons stay full-bleed squares: iOS, iPadOS and Android
         cut those to their own shape, and a pre-rounded one would come out
         with filled-in corners. The maskable pair draws the note at 40% of the
         canvas (build/generateLaunchImages.ts): Android shows only the
         middle two thirds of it, on the launcher and again on Android 12+'s
         launch screen, and at 96% both showed a note zoomed to the edges.
         At build time every href here is rewritten to a content-hashed name —
         see versionedIcons in vite.config.ts — so a changed icon is a changed
         URL and no cache can keep serving the old one. -->
    <link rel="icon" sizes="48x48" href="/apple-music/favicon-2b6befc5.ico" />
    <link rel="icon" type="image/svg+xml" href="/apple-music/icon-706c8c9f.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/apple-music/favicon-1abbf1db.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-music/apple-touch-icon-d47a9e70.png" />
    <link rel="manifest" href="/apple-music/manifest.webmanifest" />
    <!-- No viewport-fit=cover, and an opaque (not black-translucent) status
         bar: together these are what let the stylesheet do without
         env(safe-area-inset-*), which is how music.apple.com is built.
         Without cover the browser keeps the page clear of the status bar,
         the notch and the home indicator on its own, so no inset is needed
         and the chrome measures exactly Apple's 52px / 61px. Drawing edge to
         edge (cover + black-translucent, with inset tokens on every edge
         surface) was tried with the launch screen and reverted: the
         installed app showed a black bar over the home indicator. Without
         cover every env(safe-area-inset-*) reads 0 (see global.css).
         interactive-widget=resizes-content: on Android the keyboard shrinks
         the layout, as a native app's does, so the 100dvh shell, the player
         and the search suggestions stay above it instead of under it. iOS
         ignores it.
         Pinch zoom is left on (no maximum-scale / user-scalable): WCAG 1.4.4.
         Double-tap zoom is off anyway — touch-action: manipulation in
         global.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The name iOS puts under the home-screen icon, and the one Windows
         uses for a pinned site. Both say "Music", as the manifest does, so an
         installed copy is labelled the same on every platform. -->
    <meta name="apple-mobile-web-app-title" content="Music" />
    <meta name="application-name" content="Music" />
    <!-- Windows tile colour, used by Edge when the app is pinned. -->
    <meta name="msapplication-TileColor" content="#1f1f1f" />
    <meta name="description" content="Browse, search and play music." />
    <meta name="theme-color" content="#1f1f1f" />
    <!-- Dark from the first frame: the browser paints its own canvas, form
         controls and scrollbars dark before any stylesheet has arrived. -->
    <meta name="color-scheme" content="dark" />
    <title>Music</title>
    <!-- The launch splash: on screen from the very first paint until React's
         first commit (src/utils/launchSplash.ts fades it out), so the app
         opens onto its own picture instead of a blank page — on Android after
         the system's icon-on-#1f1f1f splash, on iOS after the launch image,
         which is a screenshot of exactly this (build/generateLaunchImages.ts),
         so that hand-over cannot be seen.
         Inline, and with literal colours rather than global.css's tokens:
         this paints before any stylesheet or script has loaded, offline
         included, and costs no request. The values are the tokens' own
         (--am-page-bg, --am-system-primary/-secondary, --am-key-color).
         A fixed overlay outside #root, so the app lays out underneath it from
         the start and nothing moves when it goes. -->
