<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- RELATIVE, not rooted at the deploy's base path.
         These files live in public/ and are copied verbatim, so Vite never
         rewrites them — which is why they used to spell out /apple-music/. A
         relative href resolves against this document instead, so it is correct
         wherever the app is served from: under the base path on Pages, and at
         the root of any other host or a local static server. Rooted at
         /apple-music/, that second case fetched the host's HTML 404 page for
         the manifest, which the browser then reported as
         "Manifest: Line: 1, column: 1, Syntax error". -->
    <!-- SVG first: a browser that supports it scales the vector to whatever
         the tab, bookmark bar or task switcher asks for, at any display
         density, instead of resampling a raster. The PNG stays for the ones
         that do not (Safari), and is 96px so the 16-32 CSS px a tab draws is
         a downscale even on a 2x display. -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- No viewport-fit=cover, and an opaque (not black-translucent) status
         bar: together these are what let the stylesheet contain no
         env(safe-area-inset-*) at all, which is how music.apple.com is built.
         Opting into cover here is what put the header underneath the status
         bar in the first place; without it the browser keeps the page clear of
         the notch and home indicator on its own, so no inset is needed and the
         chrome measures exactly Apple's 52px / 61px. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The name iOS puts under the home-screen icon, and the one Windows
         uses for a pinned site. Both spell out "Apple Music" rather than
         "Music", so an installed copy is labelled the same on every platform
         as the manifest labels it on Android and the desktop. -->
    <meta name="apple-mobile-web-app-title" content="Apple Music" />
    <meta name="application-name" content="Apple Music" />
    <!-- Windows tile colour, used by Edge when the app is pinned. -->
    <meta name="msapplication-TileColor" content="#1f1f1f" />
    <meta name="description" content="Browse, search and play music from the Apple Music catalogue." />
    <meta name="theme-color" content="#1f1f1f" />
    <title>Apple Music</title>
    <script type="module" crossorigin src="/apple-music/assets/index-BVfSpicc.js"></script>
    <link rel="modulepreload" crossorigin href="/apple-music/assets/rolldown-runtime-CbXtAM7H.js">
    <link rel="modulepreload" crossorigin href="/apple-music/assets/react-D3MgmOsQ.js">
    <link rel="modulepreload" crossorigin href="/apple-music/assets/state-D5uMKkKi.js">
    <link rel="modulepreload" crossorigin href="/apple-music/assets/router-CoGmKOLQ.js">
    <link rel="modulepreload" crossorigin href="/apple-music/assets/PauseIcon-GLNG_KIk.js">
    <link rel="modulepreload" crossorigin href="/apple-music/assets/toPlayerSong-FSBXYBTK.js">
    <link rel="stylesheet" crossorigin href="/apple-music/assets/PauseIcon-CWqJybro.css">
    <link rel="stylesheet" crossorigin href="/apple-music/assets/toPlayerSong-leG772tO.css">
    <link rel="stylesheet" crossorigin href="/apple-music/assets/index-BR37wLay.css">
  </head>
